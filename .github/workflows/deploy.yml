name: Deploy to GitHub Pages

# main'e her push'ta Astro build alınır ve GitHub Pages'e yayınlanır.
# Elle tetiklemek için Actions sekmesinden "Run workflow" da kullanılabilir.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN'a Pages'e deploy için gereken izinler
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy. Devam eden bir yayın varsa iptal EDİLMEZ:
# yarım kalan bir deploy production'ı bozabilir.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json repoda tutulur; npm ci tam olarak o sürümleri kurar.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Custom domain (securis.com.tr) public/CNAME üzerinden gelir.
      # Bu dosya dist/ içine kopyalanmazsa her deploy'da domain düşer.
      - name: Verify CNAME
        run: |
          test -f dist/CNAME || { echo "HATA: dist/CNAME yok — custom domain duser!"; exit 1; }
          echo "CNAME: $(cat dist/CNAME)"

      - name: Verify sitemap
        run: |
          test -f dist/sitemap.xml || { echo "HATA: dist/sitemap.xml uretilmedi!"; exit 1; }
          echo "sitemap URL sayisi: $(grep -c '<loc>' dist/sitemap.xml)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
